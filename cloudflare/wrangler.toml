name = "nms-metalife-api"
main = "src/index.js"
compatibility_date = "2024-11-01"
workers_dev = true

# D1 数据库绑定（创建后把 database_id 填进来）
# npx wrangler d1 create nms-metalife
[[d1_databases]]
binding = "DB"
database_name = "nms-metalife"
database_id = "REPLACE_WITH_YOUR_D1_ID"

# 静态前端（可选）：构建产物 dist/ 作为 Assets 一起发布
# [assets]
# directory = "../dist"
# binding = "ASSETS"

[vars]
ENV = "production"
